const LI={uz:0,en:1,ru:2,de:3}, LN={uz:'Uzbek (Latin)',en:'English',ru:'Russian',de:'German'};
const COLS=['#2e9e5b','#2f7de1','#f08a24','#8b5cf6','#e0457b'];
let S={lang:'uz',color:COLS[0],theme:'auto'},L='uz';
try{Object.assign(S,JSON.parse(localStorage.getItem('nt_s')||'{}'))}catch(e){}
const t=(k,...a)=>{let s=(K[k]||[k,k,k,k])[LI[L]];a.forEach((v,i)=>s=s.replace('{'+i+'}',v));return s};
let T=null, log=[], cur=[], sample=null, picked=null;
try{T=JSON.parse(localStorage.getItem('nt_t')||'null');log=JSON.parse(localStorage.getItem('nt_l')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('nt_t',JSON.stringify(T));localStorage.setItem('nt_l',JSON.stringify(log))}catch(e){}};
async function api(path,fd){fd.append('lang',L);const r=await fetch(path,{method:'POST',body:fd});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||'Server xatosi')}return r.json()}

function applyAll(){
  L=S.lang;const R=document.documentElement;R.lang=L;
  R.style.setProperty('--ac',S.color);
  S.theme==='auto'?R.removeAttribute('data-theme'):R.setAttribute('data-theme',S.theme);
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));
  renderSettings();showT();renderCur();renderDay();
  try{localStorage.setItem('nt_s',JSON.stringify(S))}catch(e){}
}
function renderSettings(){
  const ch=(id,arr,sel,fn)=>{$(id).innerHTML=arr.map(([v,l])=>`<button class="chip${v===sel?' on':''}" data-v="${v}">${l}</button>`).join('');$(id).onclick=e=>{const v=e.target.dataset.v;if(v)fn(v)}};
  ch('#langs',[['uz','O’zbekcha'],['en','English'],['ru','Русский'],['de','Deutsch']],S.lang,v=>{S.lang=v;applyAll()});
  ch('#themes',[['auto',t('t_auto')],['light',t('t_light')],['dark',t('t_dark')]],S.theme,v=>{S.theme=v;applyAll()});
  $('#cols').innerHTML=COLS.map(c=>`<button class="sw${c===S.color?' on':''}" data-v="${c}" style="background:${c}"></button>`).join('');
  $('#cols').onclick=e=>{const v=e.target.dataset.v;if(v){S.color=v;applyAll()}};
}
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#dd').hidden=!$('#dd').hidden};
document.addEventListener('click',()=>{$('#dd').hidden=true});
const openP=n=>{['settings','ai','chat'].forEach(x=>$('#p-'+x).hidden=x!==n);$('#modal').hidden=false;if(n==='chat'){renderChat();setTimeout(()=>$('#cin').focus(),60)}};
$('#dd').onclick=e=>{const a=e.target.closest('button');if(!a)return;openP(a.dataset.a)};
$('#fab').onclick=()=>openP('chat');
$('#modal').onclick=e=>{if(e.target.id==='modal'||e.target.closest('.mx'))$('#modal').hidden=true};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function tab(n){
  document.querySelectorAll('section').forEach(s=>s.hidden=s.id!=='t-'+n);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
  if(n==='day')renderDay();
}
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);

function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.85)};i.src=URL.createObjectURL(f)})}

const onPick=e=>{const f=e.target.files[0];if(!f)return;picked=f;const p=$('#prev');p.src=URL.createObjectURL(f);p.style.display='block'};
$('#file').onchange=onPick;$('#fileCam').onchange=onPick;

$('#go').onclick=async()=>{
  const f=picked, st=$('#st');
  if(!f){st.textContent=t('pickfirst');return}
  $('#go').disabled=true;st.textContent=t('analyzing');
  try{
    const b=await shrink(f);
    const fd=new FormData();fd.append('image',b,'food.jpg');const out=await api('/api/analyze',fd);
    cur=(out.items||[]).map(x=>({name:x.name,grams:+x.grams||100,kcal:+x.kcal||0,protein:+x.protein||0,fat:+x.fat||0,carbs:+x.carbs||0}));
    $('#note').textContent=out.note||'';
    st.textContent=cur.length?'':t('nofood');
    $('#res').hidden=!cur.length;renderCur();
  }catch(e){st.textContent=t('err')}
  $('#go').disabled=false;
};

$('#mgo').onclick=async()=>{
  const n=$('#mtext').value.trim(),st=$('#mst');
  if(!n){st.textContent=t('writefood');return}
  $('#mgo').disabled=true;st.textContent=t('calcing');
  try{
    const fd=new FormData();fd.append('text',n);const out=await api('/api/calc',fd);
    cur=(out.items||[]).map(x=>({name:x.name,grams:+x.grams||100,kcal:+x.kcal||0,protein:+x.protein||0,fat:+x.fat||0,carbs:+x.carbs||0}));
    $('#note').textContent=out.note||'';$('#res').hidden=!cur.length;renderCur();st.textContent=cur.length?'':t('nounderstood');if(cur.length)$('#mtext').value='';
  }catch(e){st.textContent=t('err')}
  $('#mgo').disabled=false;
};

function renderCur(){
  $('#items').innerHTML=cur.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><div class="m">${Math.round(x.kcal)} ${t('kcal')} · ${t('prot')} ${r1(x.protein)} ${t('g')} · ${t('fat')} ${r1(x.fat)} ${t('g')} · ${t('carb')} ${r1(x.carbs)} ${t('g')}</div></div><label class="g"><input type="number" min="1" value="${Math.round(x.grams)}" data-i2="${i}">${t('g')}</label></div>`).join('');
  $('#tot').innerHTML=`<b>${Math.round(sum(cur,'kcal'))} ${t('kcal')}</b> · ${t('prot')} ${r1(sum(cur,'protein'))} ${t('g')}`;
}
$('#items').onchange=e=>{
  const i=e.target.dataset.i2;if(i==null)return;
  const x=cur[i],n=Math.max(1,+e.target.value||x.grams),k=n/x.grams;
  ['kcal','protein','fat','carbs'].forEach(f=>x[f]*=k);x.grams=n;renderCur();
};
$('#add').onclick=()=>{
  cur.forEach(x=>log.push({d:today(),...x}));save();cur=[];$('#res').hidden=true;picked=null;$('#file').value='';$('#fileCam').value='';$('#prev').style.display='none';tab('day');
};

const pills=()=>`<span class="pill">${t('prot')} ${T.protein} ${t('g')}</span><span class="pill">${t('fat')} ${T.fat} ${t('g')}</span><span class="pill">${t('carb')} ${T.carbs} ${t('g')}</span>`;
const menuHtml=out=>(out.meals||[]).map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="m">${esc(m.foods)}</div></div><div class="m" style="text-align:right">${Math.round(m.kcal)} ${t('kcal')}<br>${Math.round(m.protein)} ${t('g')}</div></div>`).join('');

$('#gcalc').onclick=()=>{
  const sex=$('#gsex').value,age=+$('#gage').value,h=+$('#gh').value,w=+$('#gw').value,tw=+$('#gt').value,n=+$('#gn').value,act=$('#gact').value;
  const R=$('#gres'),W=$('#gwarn');
  const bad=m=>{R.hidden=false;$('#gsum').textContent=m;$('#gk').textContent='';$('#gm').innerHTML='';W.textContent='';$('#gmenu').hidden=true;$('#gmenuOut').innerHTML=''};
  if(!(age&&h&&w&&tw&&n>0))return bad(t('fillall'));
  if(tw/Math.pow(h/100,2)<18.5)return bad(t('lowbmi'));
  const weeks=$('#gu').value==='m'?n*4.345:n;
  const bmr=10*w+6.25*h-5*age+(sex==='m'?5:-161);
  const tdee=bmr*{low:1.2,light:1.375,medium:1.55,high:1.725}[act];
  const delta=tw-w;let kcal=tdee+delta/weeks*7700/7;
  if(delta<0)kcal=Math.max(kcal,sex==='m'?1500:1200,tdee*.75);else if(delta>0)kcal=Math.min(kcal,tdee*1.2);else kcal=tdee;
  kcal=Math.round(kcal);
  const real=(kcal-tdee)*7/7700, need=real?Math.abs(delta/real):0;
  const p=w*(delta<0?2:1.8),f=kcal*.25/9,c=(kcal-p*4-f*9)/4;
  T={kcal,protein:Math.round(p),fat:Math.round(f),carbs:Math.round(c),goal:delta<0?'lose':delta>0?'gain':'maintain'};save();showT();
  const e=new Date(Date.now()+need*7*864e5),z=x=>String(x).padStart(2,'0'),ds=`${z(e.getDate())}.${z(e.getMonth()+1)}.${e.getFullYear()}`;
  R.hidden=false;$('#gmenu').hidden=false;$('#gmenuOut').innerHTML='';
  $('#gsum').textContent=delta?t('sum',w,tw,(delta>0?'+':'')+r1(delta),r1(Math.abs(real))):t('keepplan');
  $('#gk').textContent=kcal+' '+t('kcal')+' / '+t('day');
  $('#gm').innerHTML=pills();
  W.textContent=!delta?'':need>weeks*1.05?t('slow',Math.round(weeks),Math.ceil(need),r1(need/4.345),ds):t('safe',ds);
};
$('#gmenu').onclick=async()=>{
  const o=$('#gmenuOut');
  o.textContent=t('planning');$('#gmenu').disabled=true;
  try{
    const fd=new FormData();['kcal','protein','fat','carbs','goal'].forEach(k=>fd.append(k,T[k]));const out=await api('/api/plan',fd);
    o.innerHTML=menuHtml(out);
  }catch(e){o.textContent=t('err')}
  $('#gmenu').disabled=false;
};

function targets(sex,age,h,w,act,goal){
  const bmr=10*w+6.25*h-5*age+(sex==='m'?5:-161);
  const tdee=bmr*{low:1.2,light:1.375,medium:1.55,high:1.725}[act];
  let kcal=tdee*{lose:.8,maintain:1,gain:1.12}[goal];
  kcal=Math.max(kcal,sex==='m'?1500:1200);
  const p=w*(goal==='lose'?2:1.8),f=kcal*.25/9,c=(kcal-p*4-f*9)/4;
  return {kcal:Math.round(kcal),protein:Math.round(p),fat:Math.round(f),carbs:Math.round(c),goal};
}
function showT(){
  if(!T)return;$('#tg').hidden=false;$('#tk').textContent=T.kcal+' '+t('kcal');$('#tm').innerHTML=pills();
}
$('#calc').onclick=()=>{
  T=targets($('#sex').value,+$('#age').value,+$('#h').value,+$('#w').value,$('#act').value,$('#goal').value);
  save();showT();$('#menuOut').innerHTML='';
};
$('#menu').onclick=async()=>{
  const o=$('#menuOut');
  o.textContent=t('planning');$('#menu').disabled=true;
  try{
    const fd=new FormData();['kcal','protein','fat','carbs','goal'].forEach(k=>fd.append(k,T[k]));const out=await api('/api/plan',fd);
    o.innerHTML=menuHtml(out);
  }catch(e){o.textContent=t('err')}
  $('#menu').disabled=false;
};

function bar(label,v,tg,u){const p=tg?Math.min(100,v/tg*100):0;return `<div class="m">${label}: ${Math.round(v)}${tg?' / '+tg:''} ${u}</div><div class="bar"><i style="width:${p}%"></i></div>`}
function renderDay(){
  const D=log.filter(x=>x.d===today());
  const k=sum(D,'kcal'),p=sum(D,'protein');
  $('#dayBox').innerHTML=T?`<div class="m">${t('left')}</div><div class="big">${Math.max(0,Math.round(T.kcal-k))} ${t('kcal')}</div>${bar(t('cal'),k,T.kcal,t('kcal'))}${bar(t('prot'),p,T.protein,t('g'))}`
    :`<div class="m">${t('eaten')}</div><div class="big">${Math.round(k)} ${t('kcal')}</div><div class="m">${t('prot')}: ${Math.round(p)} ${t('g')}. ${t('setgoal')}</div>`;
  $('#dayLog').innerHTML=D.length?D.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="m">${Math.round(x.grams)} ${t('g')} · ${Math.round(x.kcal)} ${t('kcal')} · ${t('prot')} ${r1(x.protein)} ${t('g')}</div></div><button class="del" data-id="${log.indexOf(x)}">✕</button></div>`).join(''):`<div class="m">${t('empty')}</div>`;
}
$('#dayLog').onclick=e=>{const i=e.target.dataset.id;if(i==null)return;log.splice(+i,1);save();renderDay()};

let hist=[],busy=false;
function renderChat(wait){
  const m=$('#msgs');
  m.innerHTML=`<div class="b a">${esc(t('chat_hi'))}</div>`+hist.map(x=>`<div class="b ${x.r}">${esc(x.x)}</div>`).join('')+(wait?'<div class="b a">...</div>':'');
  m.scrollTop=m.scrollHeight;
}
async function sendChat(){
  const inp=$('#cin'),q=inp.value.trim();
  if(!q||busy)return;
  hist.push({r:'u',x:q});inp.value='';busy=true;renderChat(true);
  try{
    const ctx=hist.slice(-9,-1).map(m=>(m.r==='u'?'User: ':'Coach: ')+m.x).join('\n');
    const fd=new FormData();fd.append('message',q);fd.append('history',ctx);const out=await api('/api/chat',fd);
    hist.push({r:'a',x:out.answer||t('err')});
  }catch(e){hist.push({r:'a',x:t('err')})}
  busy=false;renderChat();
}
$('#csend').onclick=sendChat;
$('#cin').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}};
$('#sq').textContent=K['q'+(1+Math.floor(Math.random()*3))][LI[S.lang]||0];
$('#start').onclick=()=>{$('#splash').classList.add('hide')};
applyAll();
</script>
</body></html>
